.mic{
  width:132px;height:132px;border-radius:50%;border:1px solid #b99132!important;
  background:#0b1219!important;color:#f2f4f7!important;padding:0!important;
  display:inline-grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none
}
.mic svg{width:48px;height:48px;fill:currentColor}
.mic.listening{animation:voicePulse 1.2s infinite}
@keyframes voicePulse{
  0%{box-shadow:0 0 0 0 rgba(216,182,83,.36)}
  70%{box-shadow:0 0 0 28px rgba(216,182,83,0)}
  100%{box-shadow:0 0 0 0 rgba(216,182,83,0)}
}
.hold{color:#f2d36b;font-weight:700;letter-spacing:.06em;margin-top:18px}
.status{color:var(--muted);min-height:26px;margin-top:12px}
.result{
  display:none;margin:28px auto 0;max-width:650px;padding:24px;
  border:1px solid #4b4230;border-radius:16px;background:#0b1219
}
.result-label{color:var(--muted);margin-bottom:8px}
.hebrew{direction:rtl;font-size:58px;line-height:1.2;color:#f2d36b;font-weight:700}
.details{line-height:1.7;margin-top:14px}
.again{
  margin-top:18px;min-height:44px;padding:8px 15px;border-radius:10px;
  border:1px solid #9f8238!important;background:linear-gradient(180deg,#f2d36b,#d4ae49)!important;
  color:#111!important;font-size:17px!important;font-weight:700
}
.foot{text-align:center;color:#768195;margin-top:20px}
#languageSelect{display:none!important}
/* The custom picker must behave as a dropdown, never as an exposed language grid. */
.custom-lang-picker{position:relative}
.custom-lang-menu{display:none!important}
.custom-lang-picker.open .custom-lang-menu{display:block!important;position:absolute!important;z-index:9999!important}
@media(max-width:600px){
  .voice-wrap{padding:16px}
  .voice-card{padding:28px 16px}
  .hebrew{font-size:48px}
}

</style>
</head>

const btn=picker.querySelector(".custom-lang-btn");
const current=picker.querySelector(".custom-lang-current");
const menu=picker.querySelector(".custom-lang-menu");

function flag(code){return '<img class="custom-lang-flag-img" alt="" src="https://flagcdn.com/w40/'+LANGS[code].cc+'.png">'}
ORDER.forEach(code=>{
  const o=document.createElement("option"); o.value=code; o.textContent=LANGS[code].name; sel.appendChild(o);
  const b=document.createElement("button"); b.type="button"; b.className="custom-lang-item"; b.dataset.value=code;
  b.innerHTML=flag(code)+'<span>'+LANGS[code].name+'</span>';
  b.onclick=()=>{sel.value=code; localStorage.setItem("manualPreferredLanguage",code); render(code); picker.classList.remove("open");};
  menu.appendChild(b);
});
btn.onclick=e=>{e.stopPropagation();picker.classList.toggle("open")};
document.addEventListener("click",()=>picker.classList.remove("open"));

function normalizeLang(raw){
  if(!raw)return null; const base=raw.toLowerCase().replace("_","-").split("-")[0];
  const aliases={in:"id",tl:"fil"}; const c=aliases[base]||base; return LANGS[c]?c:null;
}
function detectLang(){
  const saved=localStorage.getItem("manualPreferredLanguage"); if(saved&&LANGS[saved])return saved;
  for(const x of (navigator.languages||[navigator.language])){const n=normalizeLang(x);if(n)return n}
  return "en";
}
function render(code){
  const t=T[code]||T.en;
  document.documentElement.lang=code; document.documentElement.dir=LANGS[code].dir;
  sel.value=code; current.innerHTML=flag(code)+'<span>'+LANGS[code].name+'</span>';
  menu.querySelectorAll(".custom-lang-item").forEach(x=>x.classList.toggle("active",x.dataset.value===code));
  pageTitle.textContent=t.title; sub.textContent=t.sub; hold.textContent=t.hold; status.textContent=t.ready;
  navAlpha.textContent=t.navAlpha; navName.textContent=t.navName; resultLabel.textContent=t.result;
  again.textContent=t.again; foot.textContent=t.foot;
}
render(detectLang());

let mediaRecorder=null,stream=null,chunks=[],recording=false,pointerId=null;
let micPermissionReady=false, micPermissionBusy=false;
const mic=document.getElementById("mic"), statusEl=document.getElementById("status"), resultBox=document.getElementById("resultBox");

async function microphonePermissionState(){
  try{
    if(!navigator.permissions || !navigator.permissions.query) return "unknown";
    const p=await navigator.permissions.query({name:"microphone"});
    return p.state || "unknown";
  }catch(_e){
    return "unknown";
  }
}

function microphoneDiagnostic(err){
  const name=err?.name||"";
  const msg=err?.message||"";
  if(!window.isSecureContext){
    return "Microphone blocked: this page is not running in a secure HTTPS context.";
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return "Microphone unavailable: this browser does not expose microphone access to this page.";
  }
  if(name==="NotAllowedError" || name==="PermissionDeniedError" || /permission|denied|not allowed/i.test(msg)){
    return "Microphone permission is blocked for this site. Open the site's permissions, set Microphone to Allow, then reload the page.";
  }
  if(name==="NotFoundError" || name==="DevicesNotFoundError"){
    return "No microphone was found on this device.";
  }
  if(name==="NotReadableError" || name==="TrackStartError"){
    return "The microphone exists, but another app or browser process may be using it.";
  }
  return "Microphone error ["+(name||"unknown")+"]: "+(msg||"Unknown error");
}

async function primeMicrophone(){
  if(micPermissionBusy) return false;
  micPermissionBusy=true;
  const code=sel.value||"en", t=T[code]||T.en;

  try{
    if(!window.isSecureContext){
      throw Object.assign(new Error("Insecure context"),{name:"SecurityError"});
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw Object.assign(new Error("getUserMedia unavailable"),{name:"NotSupportedError"});
    }

    const testStream=await navigator.mediaDevices.getUserMedia({audio:true});
    testStream.getTracks().forEach(track=>track.stop());
    micPermissionReady=true;
    statusEl.textContent=t.ready;
    return true;
  }catch(err){
    micPermissionReady=false;
    statusEl.textContent=microphoneDiagnostic(err);
    return false;
  }finally{
    micPermissionBusy=false;
  }
}

async function beginRecording(e){
  e.preventDefault();
  if(recording || micPermissionBusy) return;

  const code=sel.value||"en",t=T[code]||T.en;

  try{
    if(!window.isSecureContext){
      statusEl.textContent=microphoneDiagnostic({name:"SecurityError",message:"Insecure context"});
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent=microphoneDiagnostic({name:"NotSupportedError",message:"getUserMedia unavailable"});
      return;
    }

    if(!micPermissionReady){
      const state=await microphonePermissionState();

      if(state==="denied"){
        statusEl.textContent="Microphone permission is blocked for this site. Open the site's permissions, set Microphone to Allow, then reload the page.";
        return;
      }

      if(state!=="granted"){
        /* First interaction is permission-only. Recording begins on the next hold. */
        const ok=await primeMicrophone();
        if(ok) statusEl.textContent=t.ready;
        return;
      }

      micPermissionReady=true;
    }

    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    const opt=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?{mimeType:"audio/webm;codecs=opus"}:{};
    mediaRecorder=new MediaRecorder(stream,opt);

    mediaRecorder.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:mediaRecorder.mimeType||"audio/webm"});
      stream?.getTracks().forEach(x=>x.stop());
      stream=null;
      recording=false;
      mic.classList.remove("listening");

      if(blob.size<500){
        statusEl.textContent=t.ready;
        return;
      }

      statusEl.textContent=t.recorded;
      resultBox.style.display="block";
      document.getElementById("hebrew").textContent="✓";
      document.getElementById("details").innerHTML='<div>'+t.voiceok+'</div><strong>'+t.next+'</strong><div>'+t.next2+'</div>';
    };

    mediaRecorder.start();
    recording=true;
    pointerId=e.pointerId;
    try{mic.setPointerCapture(pointerId)}catch(_e){}
    mic.classList.add("listening");
    statusEl.textContent=t.listening;

  }catch(err){
    stream?.getTracks().forEach(x=>x.stop());
    stream=null;
    recording=false;
    mic.classList.remove("listening");
    statusEl.textContent=microphoneDiagnostic(err);
  }
}

function endRecording(e){
  e.preventDefault();
  if(!recording||!mediaRecorder)return;
  statusEl.textContent=(T[sel.value]||T.en).processing;
  if(mediaRecorder.state==="recording")mediaRecorder.stop();
  try{if(pointerId!==null&&mic.hasPointerCapture(pointerId))mic.releasePointerCapture(pointerId)}catch(_e){}
  pointerId=null;
}

/* Read existing permission state without prompting. */
(async()=>{
  const state=await microphonePermissionState();
  if(state==="granted") micPermissionReady=true;
})();

mic.addEventListener("pointerdown",beginRecording);
mic.addEventListener("pointerup",endRecording);
mic.addEventListener("pointercancel",endRecording);
mic.addEventListener("contextmenu",e=>e.preventDefault());
again.onclick=()=>{resultBox.style.display="none";statusEl.textContent=(T[sel.value]||T.en).ready};

</script>
</body>
