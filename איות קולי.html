<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discover Your Hebrew Name</title>
<style>
:root{--bg:#05080f;--gold:#d8b45a;--gold2:#f0d98d;--text:#f7f3e8;--muted:#aeb7c7;--line:rgba(216,180,90,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 15%,rgba(42,63,105,.33),transparent 30%),var(--bg);color:var(--text);font-family:Arial,Segoe UI,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(760px,100%);text-align:center}
.brand{color:var(--gold2);font-size:14px;letter-spacing:.22em;margin-bottom:24px}
h1{font-size:clamp(34px,7vw,60px);line-height:1.05;margin:0 0 14px}
.sub{color:var(--muted);font-size:18px;line-height:1.5;margin:0 auto 38px;max-width:580px}
.mic{width:128px;height:128px;border-radius:50%;border:1px solid var(--gold);background:#0d1423;color:var(--gold2);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.mic svg{width:48px;height:48px;fill:currentColor}
.mic.listening{animation:pulse 1.25s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,180,90,.35)}70%{box-shadow:0 0 0 28px rgba(216,180,90,0)}100%{box-shadow:0 0 0 0 rgba(216,180,90,0)}}
.hint{margin-top:17px;color:var(--gold2);letter-spacing:.08em;font-size:15px}
.status{margin-top:16px;min-height:44px;color:var(--muted);font-size:14px;line-height:1.45}
.result{display:none;margin-top:34px;padding:28px 22px;border:1px solid var(--line);border-radius:22px;background:rgba(10,16,30,.86)}
.heard{font-size:14px;color:var(--muted);margin-bottom:12px}
.hebrew{direction:rtl;font-size:clamp(56px,12vw,92px);font-weight:700;color:var(--gold2);line-height:1.15}
.letters{direction:rtl;margin-top:15px;font-size:20px}
.value{margin-top:10px;color:var(--muted)}
.retry{margin-top:20px;background:none;border:0;color:var(--gold2);text-decoration:underline;cursor:pointer;font-size:14px}
.note{margin-top:28px;color:#768195;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">מא-ת ה׳שם</div>
  <h1>Discover Your Name in Hebrew</h1>
  <p class="sub">Tap the microphone and say your name naturally.</p>

  <button id="mic" class="mic" type="button" aria-label="Say your name">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>
  </button>
  <div class="hint">SAY YOUR NAME</div>
  <div id="status" class="status">Ready.</div>

  <section id="result" class="result">
    <div id="heard" class="heard"></div>
    <div id="hebrew" class="hebrew"></div>
    <div id="letters" class="letters"></div>
    <div id="value" class="value"></div>
    <button id="retry" class="retry" type="button">Say it again</button>
  </section>

  <div class="note">Microphone access requires a secure page (HTTPS) and browser permission. Embedded previews may block microphone access.</div>
</main>

<script>
const statusEl=document.getElementById("status");
const mic=document.getElementById("mic");
const result=document.getElementById("result");

const gematria={"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"כ":20,"ך":20,"ל":30,"מ":40,"ם":40,"נ":50,"ן":50,"ס":60,"ע":70,"פ":80,"ף":80,"צ":90,"ץ":90,"ק":100,"ר":200,"ש":300,"ת":400};

const common={
"michael":"מייקל","michel":"מישל","miguel":"מיגל","mikhail":"מיכאיל","david":"דיוויד","daniel":"דניאל",
"john":"ג'ון","jon":"ג'ון","james":"ג'יימס","jose":"חוסה","joseph":"ג'וזף","maria":"מריה","mary":"מרי",
"sarah":"שרה","sara":"שרה","anna":"אנה","ana":"אנה","alex":"אלכס","alexander":"אלכסנדר","robert":"רוברט",
"william":"ויליאם","george":"ג'ורג'","charles":"צ'ארלס","thomas":"תומאס","mark":"מארק","marc":"מארק",
"paul":"פול","peter":"פיטר","linda":"לינדה","jennifer":"ג'ניפר","jessica":"ג'סיקה","emily":"אמילי",
"emma":"אמה","sofia":"סופיה","sophia":"סופיה","oliver":"אוליבר","liam":"ליאם","noah":"נואה","lucas":"לוקאס",
"leo":"ליאו","omar":"עומר","ibrahim":"איברהים","mohammed":"מוחמד","muhammad":"מוחמד","ali":"עלי",
"ahmed":"אחמד","fatima":"פאטימה","yusuf":"יוסוף","mustafa":"מוסטפא","ivan":"איוון","vladimir":"ולדימיר",
"sergey":"סרגיי","nikolai":"ניקולאי"
};

function finalLetters(s){
  return s.split(/(\s+|-)/).map(part=>{
    if(!part || /(\s+|-)/.test(part)) return part;
    return part.replace(/כ$/,"ך").replace(/מ$/,"ם").replace(/נ$/,"ן").replace(/פ$/,"ף").replace(/צ$/,"ץ");
  }).join("");
}
function transliterateLatin(raw){
  let s=raw.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z' -]/g,"");
  if(common[s]) return common[s];
  const pairs=[["sch","ש"],["sh","ש"],["tch","צ'"],["ch","צ'"],["zh","ז'"],["th","ת"],["ph","פ"],["ck","ק"],["qu","קוו"],["oo","ו"],["ee","י"],["ai","יי"],["ay","יי"],["oi","וי"],["oy","וי"]];
  for(const [a,b] of pairs)s=s.split(a).join(b);
  const map={a:"א",b:"ב",c:"ק",d:"ד",e:"",f:"פ",g:"ג",h:"ה",i:"י",j:"ג'",k:"ק",l:"ל",m:"מ",n:"נ",o:"ו",p:"פ",q:"ק",r:"ר",s:"ס",t:"ט",u:"ו",v:"ו",w:"ו",x:"קס",y:"י",z:"ז"," ":" ","-":"-","'":"'"};
  let out="";
  for(const ch of s) out+=map[ch]??ch;
  return out.replace(/אא+/g,"א").replace(/ווו+/g,"וו").replace(/ייי+/g,"יי");
}
function toHebrew(t){
  if(/[\u0590-\u05FF]/.test(t)) return finalLetters(t.trim());
  return finalLetters(transliterateLatin(t));
}
function showResult(t){
  const heb=toHebrew(t);
  const chars=[...heb].filter(c=>gematria[c]);
  const total=chars.reduce((a,c)=>a+gematria[c],0);
  document.getElementById("heard").textContent="We heard: "+t;
  document.getElementById("hebrew").textContent=heb;
  document.getElementById("letters").textContent=chars.join(" · ");
  document.getElementById("value").textContent=total ? "Numerical value: "+total : "";
  result.style.display="block";
}

async function requestMic(){
  if(!window.isSecureContext){
    throw new Error("This page is not running in a secure HTTPS context.");
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("This browser cannot access the microphone here.");
  }
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  stream.getTracks().forEach(t=>t.stop());
}

async function startListening(){
  try{
    statusEl.textContent="Requesting microphone permission…";
    await requestMic();

    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      statusEl.textContent="Microphone permission works, but live speech recognition is not supported in this browser. Use Chrome on Android/Desktop.";
      return;
    }

    const rec=new SR();
    rec.lang=navigator.language||"en-US";
    rec.interimResults=false;
    rec.continuous=false;
    rec.maxAlternatives=3;

    mic.classList.add("listening");
    statusEl.textContent="Listening… say only your name.";

    rec.onresult=(e)=>{
      const t=e.results[0][0].transcript.trim();
      statusEl.textContent="Got it.";
      showResult(t);
    };
    rec.onerror=(e)=>{
      const m={
        "not-allowed":"Microphone or speech-recognition permission was blocked.",
        "no-speech":"I didn't hear a name. Tap and try again.",
        "audio-capture":"The microphone could not be accessed.",
        "network":"Speech recognition could not reach its service."
      };
      statusEl.textContent=m[e.error]||("Speech recognition error: "+e.error);
    };
    rec.onend=()=>mic.classList.remove("listening");
    rec.start();

  }catch(err){
    mic.classList.remove("listening");
    statusEl.textContent=err.message+" Open this page directly from an HTTPS website, not inside an embedded preview.";
  }
}

mic.addEventListener("click",startListening);
document.getElementById("retry").addEventListener("click",startListening);
</script>
</body>
</html>
